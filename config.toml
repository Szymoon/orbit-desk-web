# Orbit Desk settings for the Raspberry Pi server. (The website uses docs/config.js.)
# Anything left out uses the default. Every key is explained in config.example.toml.

[location]
name = "Kraków"
short = "KRK"            # label for the clock in the status bar
lat = 50.0614
lon = 19.9366
elevation_m = 220
timezone = "Europe/Warsaw"

[nasa]
# Don't put your key here if this repo is public. On the Pi, put it in
# config.local.toml (git-ignored) instead:
#   [nasa]
#   api_key = "your key"
# Free key: https://api.nasa.gov. Without one, DEMO_KEY is used (slower refresh).
api_key = "DEMO_KEY"

[aurora]
# Kp usually needed to see aurora from your latitude. About 7 for southern Poland.
kp_threshold = 7

[iss]
# Embeddable live Earth-view stream, shown by "Watch Earth live". Examples:
#   https://www.youtube.com/embed/live_stream?channel=CHANNEL_ID&autoplay=1&mute=1
#   https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1
stream_url = "https://www.youtube.com/embed/M3HKLzjvKPc?autoplay=1&mute=1"

[gallery]
queries = ["Webb nebula", "Webb galaxy", "Webb NIRCam", "Webb MIRI"]
rotate_minutes = 15

[server]
host = "localhost"   # use "0.0.0.0" to open the panel from your laptop too
port = 8321
data_dir = "data"

# Seconds between refreshes. Defaults are gentle on the public services.
[intervals]
# swpc = 120
# dsn = 10

