# Orbit Desk settings. Copy to config.toml and edit; anything left out uses the default.

[location]
name = "Kraków"
short = "KRK"            # label for the clock in the status bar
lat = 50.0614
lon = 19.9366
elevation_m = 220
timezone = "Europe/Warsaw"

[nasa]
# Free key from https://api.nasa.gov (takes a minute). DEMO_KEY works but is heavily rate-limited.
# Keep the real key out of a public repo: use config.local.toml or the NASA_API_KEY environment variable.
api_key = "DEMO_KEY"

[aurora]
# Kp usually needed to see aurora from your latitude. About 7 for southern Poland.
kp_threshold = 7

[iss]
# Embeddable live Earth-view stream, shown by "Watch Earth live". Examples:
#   https://www.youtube.com/embed/live_stream?channel=CHANNEL_ID&autoplay=1&mute=1
#   https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1
stream_url = ""

[gallery]
queries = ["Webb nebula", "Webb galaxy", "Webb NIRCam", "Webb MIRI"]
rotate_minutes = 15

# Colour themes for Display > Look. Your list replaces the built-in one and sets
# the order. Built-in ids: solar, night (Night red), day (Daylight); for those you
# only need the keys you change. A new id starts from Solar's colours.
# Keys: bg panel line text muted accent accent2 warn crit good land (CSS colours),
#       light = true for a light theme, image_filter = CSS filter for pictures.
#
# [[themes]]
# id = "solar"
#
# [[themes]]
# id = "martian"
# name = "Martian Dust"
# bg = "#140C08"
# panel = "#1F130C"
# line = "#3B2416"
# text = "#F4E4D4"
# muted = "#A88468"
# accent = "#FF4500"
# accent2 = "#EAB308"
# warn = "#EAB308"
# crit = "#FF6B4A"
# good = "#EAB308"
# land = "#2B1A10"

[server]
host = "127.0.0.1"   # use "0.0.0.0" to open the panel from your laptop too
port = 8321
data_dir = "data"

# Seconds between refreshes. Defaults are gentle on the public services.
# [intervals]
# swpc = 120
# dsn = 10
